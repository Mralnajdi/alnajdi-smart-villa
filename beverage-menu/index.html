<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MJ Beverage"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon.svg"><title>MJ Private Beverage Collection</title><style>
:root{--bg:#080808;--panel:#10100f;--text:#f5efe6;--muted:#999186;--gold:#c8a66b;--line:#ffffff18;--sprite:none}*{box-sizing:border-box}html{background:#000;scroll-behavior:smooth}body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{min-height:100svh;max-width:1240px;margin:auto;background:var(--bg);padding-bottom:76px}.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#080808d9;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font:600 11px/1.1 system-ui;letter-spacing:.22em}.crumb{font-size:10px;color:var(--muted);margin-top:4px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row{display:flex;gap:8px;align-items:center}.btn{border:1px solid #c8a66b66;background:#c8a66b12;color:#ecd9b7;border-radius:999px;padding:9px 13px;font:500 12px system-ui}.icon{width:38px;height:38px;padding:0}.hidden{display:none!important}.hero{position:relative;min-height:65svh;overflow:hidden;background:radial-gradient(circle at 25% 25%,#3c2b19,#080808 70%)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.01)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#00000018,#00000033 35%,#000000e8 88%,#080808)}.copy{position:relative;z-index:3;min-height:65svh;display:flex;flex-direction:column;justify-content:flex-end;padding:30px 20px}.eye{color:var(--gold);font-size:10px;letter-spacing:.2em;text-transform:uppercase}.serif,h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400}h1{font-size:clamp(43px,11vw,76px);line-height:.98;margin:12px 0 0;text-shadow:0 5px 22px #000}.lead{font-size:14px;line-height:1.7;color:#f5efe6bd;max-width:650px;margin:14px 0 0}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.chip{border:1px solid #c8a66b55;background:#08080866;color:#e5d2ae;border-radius:999px;padding:7px 10px;font-size:11px}.section{padding:30px 16px 44px}.title{font-size:clamp(30px,7vw,46px);margin:7px 0 0}.desc{max-width:700px;color:var(--muted);line-height:1.65;font-size:13px;margin-top:9px}.grid{display:grid;grid-template-columns:1fr;gap:13px;margin-top:20px}.cat{position:relative;min-height:230px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#111;text-align:left;padding:0;color:#fff}.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cat:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#00000011,#00000055 45%,#000000ef)}.catCopy{position:absolute;z-index:2;left:17px;right:17px;bottom:16px}.cat h3{font-size:29px;margin:7px 0 0}.cat p{font-size:13px;line-height:1.5;color:#ffffffa6;margin:5px 0 0}.sub{border:1px solid var(--line);border-radius:21px;background:#10100f;padding:16px;text-align:left;color:inherit}.sub h3{font-size:24px;margin:7px 0 0}.sub p{font-size:12px;color:var(--muted);line-height:1.55;margin:7px 0 0}.prodGrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:17px}.prod{display:grid;grid-template-columns:108px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px;border:1px solid var(--line);border-radius:20px;background:#0f0f0f;color:inherit;text-align:left}.pv,.bigpv{background-image:var(--sprite);background-repeat:no-repeat;background-size:600% 600%;background-position:calc(var(--c)*20%) calc(var(--r)*20%);background-color:#171717}.pv{width:108px;aspect-ratio:4/3;border-radius:15px;border:1px solid #ffffff14}.pn{font-size:14px;font-weight:600}.pm{color:var(--muted);font-size:11px;line-height:1.5;margin-top:5px}.arrow{color:var(--gold);font-size:18px}.detail{display:grid;grid-template-columns:1fr;gap:20px;padding:22px 16px 44px}.bigpv{width:100%;aspect-ratio:4/3;max-height:520px;border-radius:26px;border:1px solid var(--line)}.detail h1{font-size:clamp(40px,9vw,68px);margin:8px 0}.block{border:1px solid var(--line);border-radius:21px;background:#10100f;padding:16px;margin-top:13px}.block h3{font-size:25px;margin:7px 0}.facts{margin-top:9px}.fact{display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff11}.fact:last-child{border:0}.fk{color:#81796f;font-size:11px}.fv{font-size:12px;line-height:1.55}.search{width:100%;border:1px solid var(--line);background:#111;color:#fff;border-radius:16px;padding:13px 14px;outline:none;margin-top:15px}.filters{display:flex;gap:7px;overflow:auto;padding:12px 0 4px}.filter{white-space:nowrap;border:1px solid var(--line);background:#0d0d0d;color:#a89f94;border-radius:999px;padding:8px 11px;font-size:11px}.filter.on{border-color:#c8a66b88;color:#ead8b6;background:#c8a66b12}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:60;width:min(100%,1240px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#080808ee;backdrop-filter:blur(18px);border-top:1px solid var(--line)}.nav button{border:0;background:none;color:#777;padding:7px 2px;font-size:9px}.nav button.on{color:#d9c092}.nav b{display:block;font-size:15px;font-weight:400;margin-bottom:2px}[dir=rtl] .cat,[dir=rtl] .sub,[dir=rtl] .prod{text-align:right}[dir=rtl] .fact{grid-template-columns:1fr minmax(90px,34%)}[dir=rtl] .fk{order:2}[dir=rtl] .fv{order:1}.steam span{position:absolute;z-index:2;bottom:24%;left:22%;width:35px;height:90px;border-radius:50%;border-left:2px solid #ffffff36;filter:blur(4px);animation:steam 4s infinite ease-in-out}.steam span:nth-child(2){left:28%;animation-delay:1.2s}.bubbles span{position:absolute;z-index:2;right:20%;bottom:18%;width:9px;height:9px;border:1px solid #ffffff66;border-radius:50%;animation:bub 3.2s infinite}.bubbles span:nth-child(2){right:25%;animation-delay:1s}.bubbles span:nth-child(3){right:16%;animation-delay:2s}@keyframes steam{0%{opacity:0;transform:translateY(0) scale(.7)}50%{opacity:.7}100%{opacity:0;transform:translateY(-75px) scale(1.3)}}@keyframes bub{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-130px)}}@media(min-width:700px){.section{padding:42px 30px 60px}.grid,.prodGrid{grid-template-columns:repeat(2,1fr)}.copy{padding:44px 32px}.hero,.copy{min-height:610px}.detail{grid-template-columns:minmax(300px,46%) 1fr;padding:35px 30px 70px;align-items:start}.bigpv{position:sticky;top:95px}}@media(min-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}.cat{min-height:300px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style></head><body><div id="app" class="app" dir="ltr"><header class="top"><div class="row"><button id="back" class="btn icon hidden" type="button">←</button><div><div class="brand">MJ PRIVATE</div><div id="crumb" class="crumb">Beverage Collection</div></div></div><div class="row"><button id="search" class="btn icon" type="button">⌕</button><button id="lang" class="btn" type="button">عربي</button></div></header><div id="view"></div><nav class="nav"><button data-route="#/"><b>⌂</b><span data-n="home">Home</span></button><button data-route="#/collection/arabic"><b>◒</b><span data-n="arabic">Arabic</span></button><button data-route="#/collection/specialty"><b>◉</b><span data-n="coffee">Coffee</span></button><button data-route="#/collection/tea"><b>♨</b><span data-n="tea">Tea</span></button><button data-route="#/collection/sparkling"><b>◇</b><span data-n="spark">Sparkling</span></button></nav></div><script src="menu-data.js"></script><script src="menu-extra.js"></script><script>
(()=>{const D=window.MJ_MENU,E=window.MJ_EXTRA||{products:{}},C=D.cats,P=D.products,app=document.getElementById('app'),view=document.getElementById('view'),back=document.getElementById('back'),crumb=document.getElementById('crumb'),langB=document.getElementById('lang'),searchB=document.getElementById('search');let lang=localStorage.getItem('mj_lang')||'en',hero='',filter='all',q='';const ar=()=>lang==='ar',t=(e,a)=>ar()?a:e,slug=s=>s.toLowerCase().replace(/[–—&]/g,'-').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));P.forEach((p,i)=>{p.id=slug(p.nameEn);p.c=i%6;p.r=Math.floor(i/6)});const aliases={'CGLE Tres Dragones':'Methods – CGLE Tres Dragones','Pink Bourbon Punch':'Methods – Pink Bourbon Punch','Bourbon Sidra Sakura':'Methods – Bourbon Sidra Sakura','EA Decaf De Cana':'Methods – EA Decaf De Cana'},extra=p=>E.products[p.nameEn]||E.products[aliases[p.nameEn]]||{facts:[]},byid=id=>P.find(p=>p.id===id),order=['arabic','specialty','tea','sparkling'],pos={arabic:'18% 55%',specialty:'42% 62%',tea:'59% 63%',sparkling:'76% 60%'};
const fx=k=>k==='sparkling'?'<div class="bubbles"><span></span><span></span><span></span></div>':'<div class="steam"><span></span><span></span></div>',spr=p=>`--c:${p.c};--r:${p.r}`;function bind(){document.querySelectorAll('[data-route]').forEach(x=>x.onclick=()=>location.hash=x.dataset.route)}function top(r){back.classList.toggle('hidden',r==='/');let x=ar()?'مجموعة المشروبات':'Beverage Collection',a=r.split('/').filter(Boolean);if(a[0]==='collection'&&C[a[1]])x=t(C[a[1]].en,C[a[1]].ar);if(a[0]==='product'){let p=byid(a[1]);if(p)x=t(p.nameEn,p.nameAr)}crumb.textContent=x;document.querySelectorAll('.nav button').forEach(b=>{let z=b.dataset.route.slice(1);b.classList.toggle('on',z==='/'?r==='/':r.startsWith(z))})}function heroBlock(k,title,desc,n){return `<section class="hero"><img src="${hero}" style="object-position:${pos[k]||'50% 50%'}"><div class="shade"></div>${fx(k)}<div class="copy"><div class="eye">${n} ${ar()?'اختيار':'SELECTIONS'}</div><h1>${esc(title)}</h1><p class="lead">${esc(desc)}</p><div class="chips"><span class="chip">${ar()?'مجموعة منتقاة':'Curated Collection'}</span><span class="chip">AR · EN</span></div></div></section>`}
function home(){let cards=order.map((k,i)=>{let c=C[k],n=P.filter(p=>p.cat===k).length;return `<button class="cat" data-route="#/collection/${k}"><img src="${hero}" style="object-position:${pos[k]}"><div class="catCopy"><div class="eye">0${i+1} · ${n} ${ar()?'اختيار':'SELECTIONS'}</div><h3>${esc(t(c.en,c.ar))}</h3><p>${esc(t(c.subEn,c.subAr))}</p></div></button>`}).join('');view.innerHTML=`<main>${heroBlock('arabic',ar()?'فن الضيافة.':'The art of hosting.',ar()?'أربعة وثلاثون اختيارًا منتقى بعناية بين القهوة العربية والقهوة المختصة والشاي الفاخر والنكهات الغازية.':'Thirty-four carefully curated selections across Arabic coffee, specialty coffee, premium tea and sparkling flavours.',34)}<section class="section"><div class="eye">${ar()?'المجموعة':'THE COLLECTION'}</div><h2 class="title">${ar()?'اختر تجربتك':'Choose your experience'}</h2><p class="desc">${ar()?'كل قسم له شخصيته وإيحاؤه وطريقة تقديمه الخاصة.':'Every collection has its own personality, mood and serving ritual.'}</p><div class="grid">${cards}</div></section></main>`;bind()}
function collection(k,sid){let c=C[k];if(!c)return home();let items=P.filter(p=>p.cat===k);if(sid){items=items.filter(p=>slug(p.subEn)===sid);if(!items.length)return collection(k);let p=items[0];view.innerHTML=`<main><section class="section"><div class="eye">${esc(t(c.en,c.ar))}</div><h1 class="title">${esc(t(p.subEn,p.subAr))}</h1><p class="desc">${esc(t(c.subEn,c.subAr))}</p><div class="prodGrid">${items.map(pc).join('')}</div></section></main>`;bind();return}let subs=[...new Set(items.map(p=>p.subEn))];let cards=subs.map(s=>{let g=items.filter(p=>p.subEn===s),p=g[0];return `<button class="sub" data-route="#/collection/${k}/${slug(s)}"><div class="eye">${g.length} ${ar()?'اختيارات':'SELECTIONS'}</div><h3>${esc(t(s,p.subAr))}</h3><p>${esc(t(c.subEn,c.subAr))}</p></button>`}).join('');view.innerHTML=`<main>${heroBlock(k,t(c.en,c.ar),t(c.subEn,c.subAr),items.length)}<section class="section"><div class="eye">${ar()?'الأقسام الفرعية':'SUB COLLECTIONS'}</div><h2 class="title">${ar()?'استكشف التفاصيل':'Explore the details'}</h2><div class="grid">${cards}</div></section></main>`;bind()}
function pc(p){return `<button class="prod" data-route="#/product/${p.id}"><div class="pv" style="${spr(p)}"></div><div><div class="pn">${esc(t(p.nameEn,p.nameAr))}</div><div class="pm">${esc(t(p.profileEn,p.profileAr))}</div></div><span class="arrow">›</span></button>`}
function product(id){let p=byid(id);if(!p)return home();let ex=extra(p),facts=(ex.facts||[]).map(f=>`<div class="fact"><div class="fk">${esc(ar()?f[2]:f[0])}</div><div class="fv">${esc(ar()?f[3]:f[1])}</div></div>`).join('');view.innerHTML=`<main class="detail"><div class="bigpv" style="${spr(p)}"></div><div><div class="eye">${esc(t(p.subEn,p.subAr))}</div><h1>${esc(t(p.nameEn,p.nameAr))}</h1><p class="lead">${esc(t(p.descEn,p.descAr))}</p><div class="chips">${t(p.profileEn,p.profileAr).split('·').map(x=>`<span class="chip">${esc(x.trim())}</span>`).join('')}</div><div class="block"><div class="eye">${ar()?'الشخصية والإيحاء':'CHARACTER & MOOD'}</div><h3>${esc(t(p.profileEn,p.profileAr))}</h3><p class="desc">${esc(t(p.descEn,p.descAr))}</p><div class="facts"><div class="fact"><div class="fk">${ar()?'أفضل تقديم':'Best Serve'}</div><div class="fv">${esc(t(p.serveEn,p.serveAr))}</div></div><div class="fact"><div class="fk">${ar()?'أفضل وقت':'Best Time'}</div><div class="fv">${esc(t(p.timeEn,p.timeAr))}</div></div></div></div><div class="block"><div class="eye">${ar()?'التفاصيل الكاملة':'COMPLETE DETAILS'}</div><div class="facts">${facts||`<div class="fact"><div class="fv">${ar()?'لا توجد تفاصيل إضافية موثقة.':'No additional verified details.'}</div></div>`}</div></div><div class="block"><div class="eye">${ar()?'التحضير':'PREPARATION'}</div><h3>${esc(ex.device||'')}</h3><p class="desc">${(ex.modes||[]).map(x=>x==='hot'?(ar()?'ساخن':'Hot'):(ar()?'بارد':'Iced')).join(' · ')}</p></div></div></main>`}
function tags(p){let s=(p.profileEn+' '+p.descEn+' '+p.timeEn+' '+p.serveEn).toLowerCase(),a=[];if(s.includes('iced'))a.push('iced');if(s.includes('evening'))a.push('evening');if(s.includes('decaf'))a.push('decaf');if((extra(p).facts||[]).some(f=>String(f[1]).includes('0 mg')))a.push('caffeine-free');if(s.includes('sugar-free'))a.push('sugar-free');if(p.nameEn.includes('Sakura'))a.push('signature');return a}function searchPage(){let fs=[['all',ar()?'الكل':'All'],['signature','Signature'],['decaf',ar()?'ديكاف':'Decaf'],['caffeine-free',ar()?'دون كافيين':'Caffeine-Free'],['evening',ar()?'مسائي':'Evening'],['iced',ar()?'بارد':'Iced'],['sugar-free',ar()?'دون سكر':'Sugar-Free']];view.innerHTML=`<main class="section"><div class="eye">${ar()?'اكتشف':'DISCOVER'}</div><h1 class="title">${ar()?'ابحث عن مشروبك':'Find your drink'}</h1><input id="q" class="search" value="${esc(q)}" placeholder="${ar()?'ابحث بالاسم أو النكهة…':'Search by name or flavour…'}"><div class="filters">${fs.map(([x,l])=>`<button class="filter ${x===filter?'on':''}" data-f="${x}">${l}</button>`).join('')}</div><div id="res" class="prodGrid"></div></main>`;document.getElementById('q').oninput=e=>{q=e.target.value;results()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x.dataset.f===filter));results()});results();bind()}function results(){let a=P.filter(p=>!q||Object.values(p).join(' ').toLowerCase().includes(q.toLowerCase()));if(filter!=='all')a=a.filter(p=>tags(p).includes(filter));document.getElementById('res').innerHTML=a.length?a.map(pc).join(''):`<p class="desc">${ar()?'لا توجد نتائج.':'No matching selections.'}</p>`;bind()}
function route(){let r=(location.hash||'#/').replace(/^#/,'')||'/';top(r);let a=r.split('/').filter(Boolean);if(!a.length)return home();if(a[0]==='collection')return collection(a[1],a[2]);if(a[0]==='product')return product(a[1]);if(a[0]==='search')return searchPage();home()}function apply(){app.dir=ar()?'rtl':'ltr';document.documentElement.lang=ar()?'ar':'en';langB.textContent=ar()?'EN':'عربي';document.querySelector('[data-n=home]').textContent=ar()?'الرئيسية':'Home';document.querySelector('[data-n=arabic]').textContent=ar()?'عربي':'Arabic';document.querySelector('[data-n=coffee]').textContent=ar()?'قهوة':'Coffee';document.querySelector('[data-n=tea]').textContent=ar()?'شاي':'Tea';document.querySelector('[data-n=spark]').textContent=ar()?'غازي':'Sparkling'}
langB.onclick=()=>{lang=ar()?'en':'ar';localStorage.setItem('mj_lang',lang);apply();route()};back.onclick=()=>history.length>1?history.back():location.hash='#/';searchB.onclick=()=>location.hash='#/search';addEventListener('hashchange',route);bind();async function load(path){let r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(path);return 'data:image/webp;base64,'+(await r.text()).trim()}Promise.all([load('assets/hero-main.webp.b64'),load('assets/product-sprite.webp.b64')]).then(([h,s])=>{hero=h;document.documentElement.style.setProperty('--sprite',`url("${s}")`);apply();route()}).catch(()=>{apply();route()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
