<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MJ Beverage">
<title>MJ Private Beverage Collection</title>
<style>
:root{--bg:#080808;--panel:#0f0f0f;--text:#f7f0e7;--muted:#a69d91;--gold:#c8a66b;--line:rgba(255,255,255,.10)}*{box-sizing:border-box}html{background:#000}body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button{font:inherit;color:inherit}.app{min-height:100svh;background:var(--bg);max-width:1180px;margin:auto}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(8,8,8,.78);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-size:11px;letter-spacing:.2em}.crumb{font-size:11px;color:var(--muted);margin-top:4px}.tools{display:flex;gap:8px}.pill,.back{border:1px solid rgba(200,166,107,.42);background:rgba(200,166,107,.07);color:#ead8b8;border-radius:999px;padding:9px 13px}.back{width:38px;height:38px;padding:0}.hero{position:relative;min-height:64svh;overflow:hidden}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.22) 34%,rgba(0,0,0,.93) 88%,#080808)}.heroCopy{position:relative;z-index:2;min-height:64svh;display:flex;flex-direction:column;justify-content:flex-end;padding:30px 20px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}.hero h1{font-size:clamp(44px,11vw,74px);line-height:.98;color:#fff;margin-top:12px;text-shadow:0 4px 22px #000}.lead{font-size:15px;line-height:1.7;color:rgba(247,240,231,.76);max-width:620px}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip,.tag{border:1px solid rgba(200,166,107,.35);background:rgba(0,0,0,.25);border-radius:999px;padding:8px 11px;font-size:12px;color:#ead8b8}.section{padding:28px 16px 42px}.sectionTitle{font-size:31px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}.card{position:relative;min-height:235px;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#111;text-align:left;padding:0}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.28) 42%,rgba(0,0,0,.94))}.cardCopy{position:absolute;z-index:2;left:17px;right:17px;bottom:16px}.cardTitle{font-family:Georgia,serif;font-size:29px;margin-top:7px}.cardText{font-size:14px;line-height:1.5;color:rgba(255,255,255,.64);margin-top:5px}.group{margin-top:28px}.groupHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}.groupHead h3{font-size:26px;margin-top:5px}.count{font-size:11px;color:var(--gold)}.productGrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}.product{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:20px;background:#101010;text-align:left}.thumb{width:72px;height:72px;border-radius:16px;object-fit:cover}.pname{font-size:15px}.pmeta{font-size:12px;line-height:1.5;color:var(--muted);margin-top:5px}.arrow{font-size:19px;color:var(--gold)}.detailVisual{position:relative;height:44svh;min-height:300px;overflow:hidden}.detailVisual img{width:100%;height:100%;object-fit:cover}.detailVisual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.23) 56%,#080808)}.detailHead{position:relative;z-index:3;margin-top:-92px;padding:0 17px 18px}.detailHead h2{font-size:42px;line-height:1.03;color:#fff;margin-top:7px}.detailLead{color:#bcb3a7;font-size:14px;line-height:1.7}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.tag{padding:6px 9px;color:#c9c0b4;border-color:var(--line)}.block{margin:12px 16px 28px;padding:17px;border:1px solid var(--line);border-radius:22px;background:#111}.fact{display:grid;grid-template-columns:minmax(90px,34%) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}.fact:last-child{border:0}.key{font-size:12px;color:#7d766d}.val{font-size:13px;line-height:1.55}.search{padding:24px 16px 42px}.search input{width:100%;margin-top:14px;border:1px solid var(--line);border-radius:16px;background:#111;color:#fff;padding:13px 15px;font:inherit}.empty{padding:20px 0;color:var(--muted);font-size:13px}[dir=rtl] .card,[dir=rtl] .product{text-align:right}@media(min-width:700px){.grid,.productGrid{grid-template-columns:1fr 1fr}.section{padding:36px 28px 52px}.hero,.heroCopy{min-height:560px}.heroCopy{padding:42px 30px}.block{margin-left:28px;margin-right:28px}.detailHead{padding-left:28px;padding-right:28px}}
</style>
</head>
<body>
<div id="app" class="app" dir="ltr">
<header class="top"><div style="display:flex;align-items:center;gap:10px"><button id="back" class="back hidden" type="button">←</button><div><div class="brand">MJ PRIVATE</div><div id="crumb" class="crumb">Beverage Collection</div></div></div><div class="tools"><button id="searchBtn" class="pill" type="button">Search</button><button id="langBtn" class="pill" type="button">عربي</button></div></header>
<main id="homeView"><section class="hero"><img id="heroImg" alt="Luxury Arabic coffee service"><div class="heroCopy"><div id="heroEye" class="eyebrow">Private Beverage Collection</div><h1 id="heroTitle">The Art of Hosting.</h1><p id="heroNote" class="lead">A private collection, curated for every moment of hospitality.</p><div class="metrics"><span class="chip">34 Selections</span><span class="chip">4 Collections</span><span class="chip">AR · EN</span></div></div></section><section class="section"><div id="collectionEye" class="eyebrow">The Collection</div><h2 id="collectionTitle" class="sectionTitle">Choose your experience</h2><div id="catGrid" class="grid"></div></section></main>
<main id="catView" class="hidden"><section class="hero"><img id="catImg" alt=""><div class="heroCopy"><div id="catCount" class="eyebrow"></div><h1 id="catTitle"></h1><p id="catDesc" class="lead"></p></div></section><section class="section"><div id="groups"></div></section></main>
<main id="prodView" class="hidden"><div class="detailVisual"><img id="prodImg" alt=""></div><div class="detailHead"><div id="prodSub" class="eyebrow"></div><h2 id="prodTitle"></h2><p id="prodDesc" class="detailLead"></p><div id="prodTags" class="tags"></div></div><section class="block"><div id="detailsEye" class="eyebrow">Experience Details</div><div id="facts"></div></section></main>
<main id="searchView" class="hidden"><section class="search"><div class="eyebrow">Discover</div><h2 id="findTitle" class="sectionTitle">Find your drink</h2><input id="q" placeholder="Coffee, mint, decaf, evening…"><div id="results" style="margin-top:14px"></div></section></main>
</div>
<script src="menu-data.js"></script>
<script>
const D=window.MJ_MENU;
D.images={arabic:'https://images.unsplash.com/photo-1564624171349-46ed471bf4e3?auto=format&fit=crop&w=1800&q=82',specialty:'https://images.unsplash.com/photo-1774296478874-13f2c1514ef9?auto=format&fit=crop&w=1800&q=82',tea:'https://images.unsplash.com/photo-1628155423287-d626144b91c5?auto=format&fit=crop&w=1800&q=82',sparkling:'https://images.unsplash.com/photo-1781457588399-b5f0b1309096?auto=format&fit=crop&w=1800&q=82'};
const app=document.getElementById('app'),back=document.getElementById('back'),langBtn=document.getElementById('langBtn'),searchBtn=document.getElementById('searchBtn'),crumb=document.getElementById('crumb');const views={home:homeView,cat:catView,prod:prodView,search:searchView};let lang='en',stack=[{view:'home'}];const ar=()=>lang==='ar';
function show(n){Object.values(views).forEach(v=>v.classList.add('hidden'));views[n].classList.remove('hidden');back.classList.toggle('hidden',n==='home');scrollTo({top:0,behavior:'smooth'})}
function safe(img,cat){img.onerror=()=>{img.style.display='none';img.parentElement.style.background=cat==='tea'?'radial-gradient(circle at 70% 20%,#49352e,#0b0b0b 68%)':'radial-gradient(circle at 70% 20%,#3c2b19,#0b0b0b 68%)'}}
function renderHome(){heroImg.style.display='block';heroImg.src=D.images.arabic;safe(heroImg,'arabic');catGrid.innerHTML='';Object.entries(D.cats).forEach(([k,c],i)=>{const items=D.products.filter(p=>p.cat===k),b=document.createElement('button');b.className='card';b.innerHTML=`<img src="${D.images[k]}" alt=""><div class="cardCopy"><div class="eyebrow">0${i+1} · ${items.length} ${ar()?'اختيار':'selections'}</div><div class="cardTitle">${ar()?c.ar:c.en}</div><div class="cardText">${ar()?c.subAr:c.subEn}</div></div>`;safe(b.querySelector('img'),k);b.onclick=()=>openCat(k);catGrid.appendChild(b)})}
function productCard(p){const b=document.createElement('button');b.className='product';b.innerHTML=`<img class="thumb" src="${D.images[p.cat]}" alt=""><div><div class="pname">${ar()?p.nameAr:p.nameEn}</div><div class="pmeta">${ar()?p.profileAr:p.profileEn}</div></div><div class="arrow">›</div>`;safe(b.querySelector('img'),p.cat);b.onclick=()=>openProd(D.products.indexOf(p));return b}
function openCat(k,push=true){if(push)stack.push({view:'cat',key:k});const c=D.cats[k],items=D.products.filter(p=>p.cat===k);catImg.style.display='block';catImg.src=D.images[k];safe(catImg,k);catTitle.textContent=ar()?c.ar:c.en;catDesc.textContent=ar()?c.subAr:c.subEn;catCount.textContent=`${items.length} ${ar()?'اختيار':'selections'}`;crumb.textContent=ar()?c.ar:c.en;groups.innerHTML='';const gs=[];items.forEach(p=>{const s=ar()?p.subAr:p.subEn;if(!gs.includes(s))gs.push(s)});gs.forEach(s=>{const list=items.filter(p=>(ar()?p.subAr:p.subEn)===s),section=document.createElement('section');section.className='group';section.innerHTML=`<div class="groupHead"><div><div class="eyebrow">${ar()?'قسم فرعي':'Sub Collection'}</div><h3>${s}</h3></div><div class="count">${list.length} ${ar()?'اختيارات':'selections'}</div></div><div class="productGrid"></div>`;const grid=section.querySelector('.productGrid');list.forEach(p=>grid.appendChild(productCard(p)));groups.appendChild(section)});show('cat')}
function openProd(i,push=true){if(push)stack.push({view:'prod',i});const p=D.products[i];prodImg.style.display='block';prodImg.src=D.images[p.cat];safe(prodImg,p.cat);prodSub.textContent=ar()?p.subAr:p.subEn;prodTitle.textContent=ar()?p.nameAr:p.nameEn;prodDesc.textContent=ar()?p.descAr:p.descEn;prodTags.innerHTML='';(ar()?p.profileAr:p.profileEn).split('·').forEach(t=>{const s=document.createElement('span');s.className='tag';s.textContent=t.trim();prodTags.appendChild(s)});const f=ar()?[["التصنيف",p.subAr],["الطابع",p.profileAr],["أفضل تقديم",p.serveAr],["أفضل وقت",p.timeAr]]:[["Collection",p.subEn],["Character",p.profileEn],["Best Serve",p.serveEn],["Best Time",p.timeEn]];facts.innerHTML=f.map(x=>`<div class="fact"><div class="key">${x[0]}</div><div class="val">${x[1]}</div></div>`).join('');crumb.textContent=ar()?p.nameAr:p.nameEn;show('prod')}
function restore(s){if(s.view==='home'){crumb.textContent=ar()?'مجموعة المشروبات':'Beverage Collection';show('home')}else if(s.view==='cat')openCat(s.key,false);else if(s.view==='prod')openProd(s.i,false);else show('search')}
back.onclick=()=>{if(stack.length>1)stack.pop();restore(stack[stack.length-1])};searchBtn.onclick=()=>{stack.push({view:'search'});crumb.textContent=ar()?'بحث':'Search';show('search');q.focus()};q.oninput=()=>{const v=q.value.trim().toLowerCase();results.innerHTML='';if(!v){results.innerHTML=`<div class="empty">${ar()?'ابدأ بكتابة اسم أو نكهة':'Start typing a name or flavour'}</div>`;return}D.products.filter(p=>[p.nameEn,p.nameAr,p.profileEn,p.profileAr,p.descEn,p.descAr].join(' ').toLowerCase().includes(v)).forEach(p=>results.appendChild(productCard(p)))};
function relabel(){app.dir=ar()?'rtl':'ltr';langBtn.textContent=ar()?'EN':'عربي';searchBtn.textContent=ar()?'بحث':'Search';heroEye.textContent=ar()?'مجموعة المشروبات الخاصة':'Private Beverage Collection';heroTitle.textContent=ar()?'فن الضيافة.':'The Art of Hosting.';heroNote.textContent=ar()?'مجموعة خاصة، منتقاة لكل لحظة ضيافة.':'A private collection, curated for every moment of hospitality.';collectionEye.textContent=ar()?'المجموعة':'The Collection';collectionTitle.textContent=ar()?'اختر تجربتك':'Choose your experience';detailsEye.textContent=ar()?'تفاصيل التجربة':'Experience Details';findTitle.textContent=ar()?'ابحث عن مشروبك':'Find your drink';q.placeholder=ar()?'قهوة، نعناع، ديكاف، مساء…':'Coffee, mint, decaf, evening…';renderHome();restore(stack[stack.length-1])}
langBtn.onclick=()=>{lang=ar()?'en':'ar';relabel()};renderHome();show('home');
</script>
</body>
</html>
